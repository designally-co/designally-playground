packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "esbuild": true
  "sharp": true

confirmModulesPurge: false

# Temporary security override for an indirect Sanity CLI dependency.
# Remove it when Sanity's dependency tree uses the patched release directly.
overrides:
  "js-yaml": "3.15.1"
  "smol-toml": "1.8.0"

minimumReleaseAgeExclude:
  - "@next/env@16.3.3"
  - "@next/eslint-plugin-next@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-darwin-x64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"
  - next@16.3.3
